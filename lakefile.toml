name = "LambdaLab"
version = "0.1.0"
defaultTargets = ["LambdaLab"]

[[lean_lib]]
name = "LambdaLab"

[[lean_exe]]
name = "stlc"
root = "Stlc"

[[lean_exe]]
name = "float"
root = "Float"

[[lean_exe]]
name = "systemf"
root = "SystemF"

[[lean_exe]]
name = "coc"
root = "CoC"

[[lean_exe]]
name = "coic"
root = "CoIC"

[[lean_exe]]
name = "ecc"
root = "ECC"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.29.1"
